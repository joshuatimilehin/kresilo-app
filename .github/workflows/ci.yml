name: Kresilo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kresilo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository and application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, test and build
        run: pnpm build
  gates:
    name: gates
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
